        "slang": "[size=5][b]💬 那些年我们追过的古早论坛黑话与操作[/b][/size]\n[hr]\n网络词汇迭代极快，但这些论坛早期的“始祖级”流行语与迷惑行为，是整整一代网民的青春记忆。\n\n[size=4][b]一、 📖 概念黑话区[/b][/size]\n\n[b]1. 【沙发/板凳/地板】[/b]\n[quote]抢占帖子的第一条回复叫“沙发”，第二条叫“板凳”，第三条叫“地板”，之后的就只能叫“地下室”了。[/quote]\n\n[b]2. 【楼主/LZ】[/b]\n[quote]指发帖主题的作者本人。在回帖中，大家通常尊称发帖人为“楼主”或者拼音缩写“LZ”。[/quote]\n\n[b]3. 【火星】[/b]\n[quote]指分享的信息或笑话太旧、太落后，大家就会调侃他：“你火星了，刚从火星坐飞船回来吧？”[/quote]\n\n[b]4. 【潜水/冒泡】[/b]\n[quote]“潜水”指长期看帖但不回帖、不发言的人；“冒泡”则指潜水很久的人偶尔出来发个言。[/quote]\n\n[b]5. 【灌水】[/b]\n[quote]指发表无意义的回帖来刷分或增加等级。在很多严格的论坛，频繁的无意义“纯灌水”行为会被版主扣分甚至禁言。[/quote]\n\n[b]6. 【神马都是浮云】[/b]\n[quote]源于2010年，意思是“什么都不值得一提、什么都不重要”。由“什么”的谐音“神马”和“浮云”组合而成。[/quote]\n\n[hr]\n[size=4][b]二、 🎭 实战行为指南 (经典骚操作)[/b][/size]\n\n[b]1. 当我们表达对帖子的赞赏，或者想做个记号方便追更时[/b]\n[quote][i]“前排留爪！先踩踩标记一下慢慢看，楼主加油写！”[/i]\n[i]“留爪留爪！太太的文笔太绝了，果断留个爪印等更新！”[/i]\n（注：在论坛时代，“留爪”相当于现在的“留个印”、“Mark一下”、“插眼”）[/quote]\n\n[b]2. 当我们拼命想催更太太/楼主更新小说时[/b]\n[quote][i]“楼主大大，我家里刚运来了一卡车的刀片，你看是放在哪里比较合适？再不更新我们就顺着网线过去送快递了！”[/i]\n[i]“太太，我得了一种不看你更新就会呼吸衰竭的怪病，求求你救救我！”[/i][/quote]\n\n[b]3. 当我们在搬运资源贴遇到伸手党或不友善评论时[/b]\n[quote][i]“楼主顶着被封号的危险冒死搬运分享，爱看看，不看滚，嫌提取码麻烦的右转不送，别在别人的地盘秀智商上限！”[/i]\n[i]“伸手党白嫖就算了，怎么还有脸挑三拣四？楼主辛苦排版发资源，给你脸了是吧？”[/i][/quote]\n\n[b]4. 楼层灌水与水经验的万能大法[/b]\n[quote][i]“十五字十五字十五字，纯手动打字帮楼主顶贴，顺便混经验走人！”[/i]\n[i]“路过围观，强势插入，前排兜售瓜子可乐老冰棍啦！”[/i][/quote]"

            { re: /\[float=(left|right)\]([\s\S]*?)\[\/float\]/gi, to: '<div style="float:$1; margin:10px; max-width:40%;">$2</div>' },
            
            { re: /\[anchor=(.+?)\]/gi, to: '<span id="$1"></span>' },
            { re: /\[goto=(.+?)\]([\s\S]*?)\[\/goto\]/gi, to: '<a href="#$1" style="color:#0078d4; text-decoration:none;">$2</a>' },
            
            { re: /\[alert=success\]([\s\S]*?)\[\/alert\]/gi, to: '<div style="background:#f6ffed; border:1px solid #b7eb8f; border-left:4px solid #52c41a; padding:10px 15px; margin:10px 0; border-radius:4px; color:rgba(0,0,0,0.85); font-size:14px; display:flex; align-items:center; gap:8px;">✅ $1</div>' },
            { re: /\[alert=warning\]([\s\S]*?)\[\/alert\]/gi, to: '<div style="background:#fff9e6; border:1px solid #ffe58f; border-left:4px solid #faad14; padding:10px 15px; margin:10px 0; border-radius:4px; color:rgba(0,0,0,0.85); font-size:14px; display:flex; align-items:center; gap:8px;">⚠️ $1</div>' },
            { re: /\[alert=info\]([\s\S]*?)\[\/alert\]/gi, to: '<div style="background:#e6f7ff; border:1px solid #91d5ff; border-left:4px solid #1890ff; padding:10px 15px; margin:10px 0; border-radius:4px; color:rgba(0,0,0,0.85); font-size:14px; display:flex; align-items:center; gap:8px;">ℹ️ $1</div>' },
            
            { re: /\[bubble=left,(.+?)\]([\s\S]*?)\[\/bubble\]/gi, to: '<div style="display:flex; align-items:flex-start; margin:10px 0;"><div style="background:#f3f2f1; padding:8px 12px; border-radius:8px; border-top-left-radius:0; max-width:70%; box-shadow:0 1px 2px rgba(0,0,0,0.1);"><strong style="font-size:11px; color:#666; display:block; margin-bottom:4px;">$1</strong>$2</div></div>' },
            { re: /\[bubble=right,(.+?)\]([\s\S]*?)\[\/bubble\]/gi, to: '<div style="display:flex; justify-content:flex-end; align-items:flex-start; margin:10px 0;"><div style="background:#dff6dd; padding:8px 12px; border-radius:8px; border-top-right-radius:0; max-width:70%; box-shadow:0 1px 2px rgba(0,0,0,0.1); text-align:right;"><strong style="font-size:11px; color:#666; display:block; margin-bottom:4px;">$1</strong>$2</div></div>' },
            
            { re: /\[url=(.+?)\]([\s\S]*?)\[\/url\]/gi, to: '<a href="$1" target="_blank" style="color:#0078d4;text-decoration:none;">$2</a>' },
            { re: /\[img\](.*?)\[\/img\]/gi, to: '<img src="$1"/>' },
            { re: /\[img=(\d+)\](.*?)\[\/img\]/gi, to: '<img src="$2" width="$1"/>' },
            { re: /\[img=(\d+),(\d+)\](.*?)\[\/img\]/gi, to: '<img src="$3" width="$1" height="$2"/>' },
            { re: /\[quote\]([\s\S]*?)\[\/quote\]/gi, to: '<blockquote>$1</blockquote>' },
            { re: /\[hr\]/gi, to: '<hr style="border:0; border-top:1px dashed #ccc; margin:15px 0;"/>' },
            { re: /\[spoiler\]([\s\S]*?)\[\/spoiler\]/gi, to: '<details><summary>点击展开隐藏内容</summary><div style="padding-top:10px;">$1</div></details>' },
            { re: /\[ruby=(.+?)\]([\s\S]*?)\[\/ruby\]/gi, to: '<ruby>$2<rt style="font-size:0.7em; color:#888;">$1</rt></ruby>' },
            { re: /\[list\]([\s\S]*?)\[\/list\]/gi, to: '<ul style="margin:10px 0; padding-left:20px;">$1</ul>' },
            { re: /\[list=1\]([\s\S]*?)\[\/list\]/gi, to: '<ol style="margin:10px 0; padding-left:20px;">$1</ol>' },
            { re: /\[marquee\]([\s\S]*?)\[\/marquee\]/gi, to: '<marquee scrollamount="4">$1</marquee>' },
            { re: /\[fly\]([\s\S]*?)\[\/fly\]/gi, to: '<marquee behavior="alternate" scrollamount="4">$1</marquee>' }
        ];

        for(let i=0; i<3; i++) r.forEach(rule => h = h.replace(rule.re, rule.to));
        h = h.replace(/\n/g, '<br/>');
        
        h = h.replace(/%%%CODE_BLOCK_(\d+)%%%/g, function(match, index) {
            let rawCode = codes[index];
            let encodedCode = encodeURIComponent(rawCode);
            let innerCode = rawCode.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br/>');
            
            return `<div class="code-wrapper">
                        <button class="copy-btn" onclick="copyCode(this, '${encodedCode}')">复制源码</button>
                        <div class="code-block">${innerCode}</div>
                    </div>`;
        });

        return h;
    }

    function update() { 
        if(editor && preview) {
            preview.innerHTML = parse(editor.value); 
        }
    }
    
    function loadEx(k) { 
        if(editor && ex[k]) {
            const rawData = ex[k];
            preview.innerHTML = parse(rawData);
            
            // 完美剔除左边多余的源码框说明和源码块
            let editorData = rawData.replace(/\[b\][^\]]*?源码[^\]]*?\[\/b\]\s*\[code\][\s\S]*?\[\/code\]/gi, '');
            editorData = editorData.replace(/\[code\][\s\S]*?\[\/code\]/gi, '');
            
            editor.value = editorData.trim();
            
            document.querySelectorAll('.toolbar button').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.querySelector(`button[data-tab="${k}"]`);
            if (activeBtn) activeBtn.classList.add('active');
            
            localStorage.setItem('bbcode_active_tab', k);
        }
    }
    
    if(editor) {
        editor.addEventListener('input', update);
        
        const savedTab = localStorage.getItem('bbcode_active_tab') || 'basic';
        loadEx(savedTab); 
        
        let isSyncingLeft = false;
        let isSyncingRight = false;
        
        editor.addEventListener('scroll', function() {
            if (!isSyncingLeft) {
                isSyncingRight = true;
                const percentage = this.scrollTop / (this.scrollHeight - this.clientHeight);
                preview.scrollTop = percentage * (preview.scrollHeight - preview.clientHeight);
            }
            isSyncingLeft = false;
        });

        preview.addEventListener('scroll', function() {
            if (!isSyncingRight) {
                isSyncingLeft = true;
                const percentage = this.scrollTop / (this.scrollHeight - this.clientHeight);
                editor.scrollTop = percentage * (editor.scrollHeight - editor.clientHeight);
            }
            isSyncingRight = false;
        });
    }
</script>
</body>
</html>
